name: Post actions regression tests

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "storage.py"
      - "payments.py"
      - "post_lookup.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/post-actions-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
